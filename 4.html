
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فرم ثبت اطلاعات شخصی</title>
    <link rel="stylesheet" href="4.css">
</head>

<body>

    <header>
        <h1>فرم ثبت اطلاعات شخصی</h1>
        <p>اطلاعات خود را وارد کنید و فرم را ارسال کنید.</p>
    </header>

    <main>
        <section class="form-container">

            <div class="form-image">
                <img src="2.jpg" alt="کار با لپ‌تاپ">

                <div class="image-text">
                    <h2>به دنیای ما خوش آمدید!</h2>
                    <p>
                        اطلاعات خود را ثبت کنید و علایق خود را
                        با ما به اشتراک بگذارید.
                    </p>
                </div>
            </div>

            <form action="" method="GET" id="personalForm">

                <h2>اطلاعات فردی</h2>

                <!-- نام -->
                <div class="form-group">
                    <label for="firstName">نام:</label>
                    <input
                        type="text"
                        id="firstName"
                        name="first_name"
                        placeholder="نام خود را وارد کنید"
                        required
                    >
                </div>

                <!-- نام خانوادگی -->
                <div class="form-group">
                    <label for="lastName">نام خانوادگی:</label>
                    <input
                        type="text"
                        id="lastName"
                        name="last_name"
                        placeholder="نام خانوادگی خود را وارد کنید"
                        required
                    >
                </div>

                <!-- ایمیل -->
                <div class="form-group">
                    <label for="email">ایمیل:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@gmail.com"
                        required
                    >
                </div>

                <!-- شماره موبایل -->
                <div class="form-group">
                    <label for="phone">شماره موبایل:</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="09123456789"
                        pattern="09[0-9]{9}"
                        minlength="11"
                        maxlength="11"
                        inputmode="numeric"
                        title="شماره موبایل باید 11 رقم و با 09 شروع شود"
                        required
                    >
                </div>

                <!-- تاریخ تولد -->
                <div class="form-group">
                    <label>تاریخ تولد شمسی:</label>

                    <div class="birth-date">
                        <select id="birthDay" name="birth_day" required>
                            <option value="">روز</option>
                        </select>

                        <select id="birthMonth" name="birth_month" required>
                            <option value="">ماه</option>
                            <option value="1">فروردین</option>
                            <option value="2">اردیبهشت</option>
                            <option value="3">خرداد</option>
                            <option value="4">تیر</option>
                            <option value="5">مرداد</option>
                            <option value="6">شهریور</option>
                            <option value="7">مهر</option>
                            <option value="8">آبان</option>
                            <option value="9">آذر</option>
                            <option value="10">دی</option>
                            <option value="11">بهمن</option>
                            <option value="12">اسفند</option>
                        </select>

                        <select id="birthYear" name="birth_year" required>
                            <option value="">سال</option>
                        </select>
                    </div>
                </div>

                <!-- استان -->
                <div class="form-group">
                    <label for="province">استان محل تولد:</label>

                    <select id="province" name="province" required>
                        <option value="">استان را انتخاب کنید</option>
                        <option value="تهران">تهران</option>
                        <option value="اصفهان">اصفهان</option>
                        <option value="فارس">فارس</option>
                        <option value="خراسان رضوی">خراسان رضوی</option>
                        <option value="آذربایجان شرقی">آذربایجان شرقی</option>
                        <option value="گیلان">گیلان</option>
                    </select>
                </div>

                <!-- شهر -->
                <div class="form-group">
                    <label for="city">شهر محل تولد:</label>

                    <select id="city" name="city" required disabled>
                        <option value="">ابتدا استان را انتخاب کنید</option>
                    </select>
                </div>

                <!-- جنسیت -->
                <fieldset class="form-group">
                    <legend>جنسیت:</legend>

                    <div class="options">
                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="مرد"
                                required
                            >
                            مرد
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="زن"
                            >
                            زن
                        </label>
                    </div>
                </fieldset>

                <!-- علاقه‌مندی‌ها -->
                <fieldset class="form-group">
                    <legend>علاقه‌مندی‌ها:</legend>

                    <div class="options interests">
                        <label>
                            <input
                                type="checkbox"
                                name="interests"
                                value="برنامه نویسی"
                            >
                            برنامه‌نویسی
                        </label>

                        <label>
                            <input
                                type="checkbox"
                                name="interests"
                                value="طراحی وب"
                            >
                            طراحی وب
                        </label>

                        <label>
                            <input
                                type="checkbox"
                                name="interests"
                                value="هوش مصنوعی"
                            >
                            هوش مصنوعی
                        </label>

                        <label>
                            <input
                                type="checkbox"
                                name="interests"
                                value="بازی سازی"
                            >
                            بازی‌سازی
                        </label>
                    </div>
                </fieldset>

                <!-- دکمه‌ها -->
                <div class="buttons">
                    <button type="submit" class="submit-btn">
                        ارسال اطلاعات
                    </button>

                    <button type="reset" class="clear-btn">
                        پاک کردن فرم
                    </button>
                </div>

            </form>
        </section>
    </main>

    <footer>
        فرم تمرینی Selenium
    </footer>

    <script src="4.js"></script>

</body>
</html>
